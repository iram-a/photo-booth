<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spooky Sweet Snaps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;700&family=Nosifier&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .font-creepster {
      font-family: 'Creepster', cursive;
    }

    .frame-container {
      max-width: 1070px;
      width: 100%;
      aspect-ratio: 4 / 3;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .frame-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: rotate(90deg);
      pointer-events: none;
      z-index: 35;
    }

    #video-feed {
      position: absolute;
      top: 50%;
      left: 49%;
      width: 50%;
      height: 42%;
      object-fit: cover;
      transform: translate(-50%, -50%) scaleX(-1);
      border-radius: 50%;
      z-index: 40;
      background-color: #1a1a1a;
    }

    .action-button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.2s ease-in-out, filter 0.2s ease-in-out;
    }

    .action-button img {
      width: 100%;
      height: auto;
    }

    .action-button:hover:not(:disabled) {
      transform: scale(1.07);
      filter: drop-shadow(0 0 10px rgba(255, 180, 80, 0.7));
    }

    .action-button:active:not(:disabled) {
      transform: scale(1.02);
    }

    .action-button:disabled {
      cursor: not-allowed;
      filter: grayscale(80%) opacity(0.5);
    }

    #photo-strip {
      position: relative;
      width: 120%;
      height: 85vh;
      margin-top: -5vh;
      margin-right: -10%;
    }

    .photo-wrapper {
      position: absolute;
      width: 120%;
      height: 28%;
      left: -10%;
      overflow: hidden;
    }

    #photo-wrapper-1 { top: 0%; }
    #photo-wrapper-2 { top: 32%; }
    #photo-wrapper-3 { top: 64%; }

    .photo-slot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 52%;
      height: 92%;
      object-fit: cover;
      transform: translate(-50%, -50%) scaleX(-1);
      border-radius: 4px;
      z-index: 1;
      background-color: #000;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .photo-frame-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140%;
      height: 130%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 15px rgba(255, 180, 80, 0.2));
      object-fit: contain;
    }

    .floating-witch {
      position: absolute;
      width: 350px;
      right: 580px;
      top: 50%;
      z-index: 45;
      animation: floatWitch 6s ease-in-out infinite;
    }

    @keyframes floatWitch {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    .floating-pumpkin {
      position: absolute;
      z-index: 45;
      animation: floatPumpkin 5s ease-in-out infinite;
    }

    .pumpkin-1 {
      left: -20%;
      width: 300px;
      top: -12%;
      animation-delay: 0s;
    }

    .pumpkin-2 {
      right: 5%;
      width: 250px;
      bottom: 60%;
      animation-delay: 1.5s;
    }

    .pumpkin-3 {
      left: -35%;
      bottom: 22%;
      width: 260px;
      animation-delay: 3s;
    } 

    @keyframes floatPumpkin {
      0%, 100% {
        transform: translateY(0) rotate(3deg);
      }
      50% {
        transform: translateY(-15px) rotate(-3deg);
      }
    }

    .floating-ghost {
      position: absolute;
      z-index: 45;
      animation: floatGhost 7s ease-in-out infinite;
      opacity: 0.9;
    }

    .ghost-1 {
      left: 125%;
      top: -13%;
      width: 180px;
      animation-delay: 1s;
    }

    .ghost-2 {
      right:-15%;
      top: 72%;
      width: 150px;
      animation-delay: 3.5s;
    }

    .ghost-3 {
      right: 25%;
      bottom: 2%;
      width: 200px;
      animation-delay: 2s;
    }

    @keyframes floatGhost {
      0%, 100% {
        transform: translateY(0) translateX(0) rotate(2deg);
      }
      50% {
        transform: translateY(-25px) translateX(15px) rotate(-2deg);
      }
    }

    /* Email Modal Styles */
    .email-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .email-modal-content {
      background: linear-gradient(135deg, #8B0000, #2D1B69);
      padding: 2rem;
      border-radius: 15px;
      border: 3px solid #FF6B00;
      box-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
      max-width: 400px;
      width: 90%;
    }

    .email-input {
      width: 100%;
      padding: 12px;
      margin: 1rem 0;
      border: 2px solid #FF6B00;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
    }

    .email-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .modal-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .modal-button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: 'Creepster', cursive;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .send-button {
      background: #FF6B00;
      color: white;
    }

    .send-button:hover {
      background: #FF8C00;
      transform: scale(1.05);
    }

    .cancel-button {
      background: #666;
      color: white;
    }

    .cancel-button:hover {
      background: #888;
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #FF6B00;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="bg-gray-900 text-white">
  <!-- Audio elements -->
  <audio id="beep1" src="beep.wav" preload="auto"></audio>
  <audio id="beep2" src="beep.wav" preload="auto"></audio>
  <audio id="beep3" src="beep.wav" preload="auto"></audio>
  <audio id="cameraSound" src="shutter.mp3" preload="auto"></audio>
  <audio id="backgroundMusic" src="spooky.mp3" loop></audio>

  <div class="relative w-full h-screen flex flex-col bg-cover bg-center bg-no-repeat" style="background-image: url('background-photo.webp');">

    <!-- Header -->
    <header class="absolute top-0 left-0 w-full p-4 z-50 flex items-center">
      <div class="flex-none">
        <img src="image.png" alt="Muso Logo" class="h-16 w-auto" />
      </div>
      <div class="flex-grow text-center">
        <h1 class="font-creepster text-5xl md:text-6xl text-orange-400 tracking-wider" style="text-shadow: 6px 6px 0 #8A0303, 10px 10px 0 rgba(0,0,0,0.95); -webkit-text-stroke: 3px rgba(51,0,102,0.9); margin:0;">
          Muso's Spooky Make-a-Snap
        </h1>
      </div>
      <div class="flex-none" style="width:64px;"></div>
    </header>

    <!-- Main Content -->
    <div class="grid grid-cols-12 gap-4 w-full h-full pt-24 px-4">

      <!-- Controls -->
      <div id="controls" class="col-span-2 flex flex-col items-center justify-center gap-1">
        <button id="start-btn" class="action-button w-4/5">
          <img src="image-removebg-preview (1).png" alt="Start" />
        </button>
        <button id="capture-btn" class="action-button w-4/5" disabled>
          <img src="image-removebg-preview (2).png" alt="Capture" />
        </button>
        <button id="recapture-btn" class="action-button w-4/5" disabled>
          <img src="image-removebg-preview (3).png" alt="Recapture" />
        </button>
      </div>

      <!-- Center Video Feed -->
      <main class="col-span-7 flex flex-col justify-center items-center h-full">
        <div class="frame-container">
          <video id="video-feed" playsinline></video>
          <img src="Frame.png" alt="Spooky Frame" class="frame-image" />
          <img src="Witch.png" alt="Floating Witch" class="floating-witch" />
          <img src="Pumpkin.png" alt="Floating Pumpkin 1" class="floating-pumpkin pumpkin-1" />
          <img src="Pumpkin.png" alt="Floating Pumpkin 2" class="floating-pumpkin pumpkin-2" />
          <img src="Pumpkin.png" alt="Floating Pumpkin 3" class="floating-pumpkin pumpkin-3" />
          <img src="Floating ghost.png" alt="Floating Ghost 1" class="floating-ghost ghost-1" />
          <img src="Floating ghost.png" alt="Floating Ghost 2" class="floating-ghost ghost-2" />
          <img src="Floating ghost.png" alt="Floating Ghost 3" class="floating-ghost ghost-3" />
        </div>
      </main>

      <!-- Photo Strip -->
      <aside class="col-span-3 flex justify-center items-start pt-16 pr-4">
        <div id="photo-strip">
          <div class="photo-wrapper" id="photo-wrapper-1">
            <img id="photo-1" class="photo-slot" />
            <img src="gold frame.png" class="photo-frame-overlay" />
          </div>
          <div class="photo-wrapper" id="photo-wrapper-2">
            <img id="photo-2" class="photo-slot" />
            <img src="gold frame.png" class="photo-frame-overlay" />
          </div>
          <div class="photo-wrapper" id="photo-wrapper-3">
            <img id="photo-3" class="photo-slot" />
            <img src="gold frame.png" class="photo-frame-overlay" />
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Hidden canvas -->
  <canvas id="photo-canvas" style="display: none;"></canvas>

  <!-- JavaScript -->
  <script>
    const videoElement = document.getElementById('video-feed');
    const canvasElement = document.getElementById('photo-canvas');
    const startButton = document.getElementById('start-btn');
    const captureButton = document.getElementById('capture-btn');
    const recaptureButton = document.getElementById('recapture-btn');
    const photoSlots = [
      document.getElementById('photo-1'),
      document.getElementById('photo-2'),
      document.getElementById('photo-3'),
    ];
    const beepSounds = [
      document.getElementById('beep1'),
      document.getElementById('beep2'),
      document.getElementById('beep3')
    ];
    const cameraSound = document.getElementById('cameraSound');

    let stream;
    let captureCount = 0;
    
    // Background music control
    const backgroundMusic = document.getElementById('backgroundMusic');
    
    // Function to start background music
    async function playBackgroundMusic() {
        try {
            backgroundMusic.volume = 0.8;
            await backgroundMusic.play();
            console.log('Background music started');
        } catch (error) {
            console.error('Failed to play background music:', error);
        }
    }

    // Try to play music when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        backgroundMusic.load();
    });

    // Play music on any user interaction
    const playAttempt = () => {
        playBackgroundMusic();
        document.removeEventListener('click', playAttempt);
        document.removeEventListener('touchstart', playAttempt);
        document.removeEventListener('keydown', playAttempt);
    };

    document.addEventListener('click', playAttempt);
    document.addEventListener('touchstart', playAttempt);
    document.addEventListener('keydown', playAttempt);

    async function startCamera() {
      if (stream) return;
      try {
        playBackgroundMusic();
        
        stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
        videoElement.srcObject = stream;
        videoElement.play();
        startButton.disabled = true;
        captureButton.disabled = false;
      } catch (err) {
        console.error("CRITICAL ERROR accessing the camera: ", err.name, err.message);
        alert("Could not access the camera. Please check your browser permissions.");
      }
    }

    // Create countdown overlay
    const countdownOverlay = document.createElement('div');
    countdownOverlay.style.cssText = `
      position: fixed;
      top: 60%;
      left: 45%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      font-weight: bold;
      color:#8A0303;
      text-shadow: 4px 4px 0 #000;
      z-index: 1000;
      font-family: 'Creepster', cursive;
      opacity: 0;
      transition: opacity 0.3s;
    `;
    document.body.appendChild(countdownOverlay);

    async function capturePhoto() {
      if (captureCount >= 4) return;
      
      // Disable buttons during countdown
      captureButton.disabled = true;
      recaptureButton.disabled = true;

      // Start countdown
      for(let i = 3; i > 0; i--) {
        countdownOverlay.textContent = i;
        countdownOverlay.style.opacity = '1';
        try {
          const beep = beepSounds[i-1];
          beep.volume = 0.5;
          beep.currentTime = 0;
          await beep.play();
        } catch (err) {
          console.log('Audio playback failed:', err);
        }
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      countdownOverlay.style.opacity = '0';
      try {
        cameraSound.volume = 0.4;
        cameraSound.currentTime = 0;
        await cameraSound.play();
      } catch (err) {
        console.log('Camera sound playback failed:', err);
      }

      // Take the photo
      const context = canvasElement.getContext('2d');
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      context.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      const dataUrl = canvasElement.toDataURL('image/png');
      photoSlots[captureCount].src = dataUrl;
      captureCount++;

      // Re-enable buttons as appropriate
      recaptureButton.disabled = captureCount === 0;
      captureButton.disabled = captureCount >= 4;

      // Show action buttons when all 3 photos are taken
      if (captureCount === 3) {
        createActionButtons();
      }
    }

    function createPhotoStrip() {
      const stripCanvas = document.createElement('canvas');
      const ctx = stripCanvas.getContext('2d');
      
      stripCanvas.width = 800;
      stripCanvas.height = 1200;
      
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

      for(let i = 0; i < 3; i++) {
        const photo = photoSlots[i];
        if (photo.src) {
          const y = i * (stripCanvas.height / 3);
          ctx.drawImage(photo, 0, y, stripCanvas.width, stripCanvas.height / 3);
        }
      }

      ctx.fillStyle = '#ff6b00';
      ctx.font = 'bold 30px Creepster';
      ctx.textAlign = 'center';
      ctx.fillText("Muso's Spooky Make-a-Snap", stripCanvas.width / 2, stripCanvas.height - 20);

      return stripCanvas.toDataURL('image/jpeg', 0.9);
    }

    function createActionButtons() {
      const buttonContainer = document.createElement('div');
      buttonContainer.style.position = 'absolute';
      buttonContainer.style.left = '50%';
      buttonContainer.style.transform = 'translateX(-50%)';
      buttonContainer.style.bottom = '20px';
      buttonContainer.style.zIndex = '100';
      buttonContainer.style.display = 'flex';
      buttonContainer.style.gap = '20px';
      buttonContainer.style.flexWrap = 'wrap';
      buttonContainer.style.justifyContent = 'center';

      // Download Button
      const downloadBtn = document.createElement('button');
      downloadBtn.innerHTML = '⬇️ Download';
      downloadBtn.className = 'action-button bg-orange-600 text-white py-4 px-8 rounded-lg hover:bg-orange-700 transition-colors font-creepster text-2xl';
      downloadBtn.style.whiteSpace = 'nowrap';
      downloadBtn.style.textShadow = '2px 2px 0 #8A0303';
      downloadBtn.style.border = '2px solid #8A0303';
      downloadBtn.style.boxShadow = '0 0 15px rgba(255, 107, 0, 0.5)';
      
      downloadBtn.onclick = function() {
  const dataUrl = createPhotoStrip(); // Keep original quality for download
  const link = document.createElement('a');
  link.download = 'spooky-photo-strip.jpg';
  link.href = dataUrl;
  link.click();
};

      // Email Button
      const emailBtn = document.createElement('button');
      emailBtn.innerHTML = '📧 Send by Email';
      emailBtn.className = 'action-button bg-green-600 text-white py-4 px-8 rounded-lg hover:bg-green-700 transition-colors font-creepster text-2xl';
      emailBtn.style.whiteSpace = 'nowrap';
      emailBtn.style.textShadow = '2px 2px 0 #8A0303';
      emailBtn.style.border = '2px solid #8A0303';
      emailBtn.style.boxShadow = '0 0 15px rgba(0, 255, 0, 0.5)';
      
      emailBtn.onclick = function() {
        showEmailModal();
      };

      buttonContainer.appendChild(downloadBtn);
      buttonContainer.appendChild(emailBtn);

      const frameContainer = document.querySelector('.frame-container');
      frameContainer.appendChild(buttonContainer);
    }

    function showEmailModal() {
      const modal = document.createElement('div');
      modal.className = 'email-modal';
      modal.innerHTML = `
        <div class="email-modal-content">
          <h2 class="font-creepster text-3xl text-center text-orange-400 mb-4">Send to Email</h2>
          <p class="text-center mb-4">Enter your email address to receive your spooky photo strip!</p>
          <input type="email" id="email-input" class="email-input" placeholder="your@email.com" required>
          <div class="modal-buttons">
            <button class="modal-button cancel-button" id="cancel-email">Cancel</button>
            <button class="modal-button send-button" id="send-email">Send</button>
          </div>
          <div id="email-status" class="text-center mt-4 hidden"></div>
        </div>
      `;

      document.body.appendChild(modal);

      document.getElementById('cancel-email').addEventListener('click', () => {
        document.body.removeChild(modal);
      });

      document.getElementById('send-email').addEventListener('click', sendEmail);

      document.getElementById('email-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendEmail();
        }
      });

      // Focus on input
      document.getElementById('email-input').focus();
    }

    async function sendEmail() {
  const emailInput = document.getElementById('email-input');
  const email = emailInput.value.trim();
  const statusDiv = document.getElementById('email-status');
  
  // Basic email validation
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    statusDiv.textContent = 'Please enter a valid email address!';
    statusDiv.className = 'text-center mt-4 text-red-400';
    statusDiv.classList.remove('hidden');
    return;
  }

  const sendButton = document.getElementById('send-email');
  sendButton.disabled = true;
  sendButton.innerHTML = '<span class="loading-spinner"></span>Sending...';

  try {
    // Create the photo strip with compression
    const photoStripDataUrl = await createCompressedPhotoStrip();
    
    console.log('Sending email to:', email);
    
    // Send to our backend
    const response = await fetch('/send-email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        email: email,
        photo_data: photoStripDataUrl
      }),
    });

    const result = await response.json();
    console.log('Backend response:', result);

    if (result.success) {
      statusDiv.textContent = '✅ Photo strip sent successfully! Check your email (including spam folder).';
      statusDiv.className = 'text-center mt-4 text-green-400';
      statusDiv.classList.remove('hidden');
      
      // Close modal after 4 seconds
      setTimeout(() => {
        const modal = document.querySelector('.email-modal');
        if (modal) document.body.removeChild(modal);
      }, 4000);
    } else {
      throw new Error(result.error || 'Failed to send email');
    }
  } catch (error) {
    console.error('Error sending email:', error);
    statusDiv.innerHTML = '❌ Failed to send email. Please try again.';
    statusDiv.className = 'text-center mt-4 text-red-400';
    statusDiv.classList.remove('hidden');
    sendButton.disabled = false;
    sendButton.innerHTML = 'Send';
  }
}

// Compressed version of createPhotoStrip
// Function to create the final compressed photo strip with the photo positioned correctly
async function createCompressedPhotoStrip() {
  return new Promise((resolve) => {
    const stripCanvas = document.createElement('canvas');
    const ctx = stripCanvas.getContext('2d');

    // Match visual proportions from the webpage
    stripCanvas.width = 600;
    stripCanvas.height = 900;

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

    const frameImage = new Image();
    frameImage.src = 'gold frame.png';

    frameImage.onload = () => {
      let imagesLoaded = 0;

      function checkAllLoaded() {
        imagesLoaded++;
        if (imagesLoaded === 3) {
          ctx.fillStyle = '#ff6b00';
          ctx.font = 'bold 20px Creepster';
          ctx.textAlign = 'center';
          ctx.fillText("Muso's Spooky Make-a-Snap", stripCanvas.width / 2, stripCanvas.height - 15);
          const compressedDataUrl = stripCanvas.toDataURL('image/jpeg', 0.9);
          resolve(compressedDataUrl);
        }
      }

      const slotHeight = stripCanvas.height / 3; // 300px per slot

      for (let i = 0; i < 3; i++) {
        const photo = photoSlots[i];
        const frameY = i * slotHeight;

        if (photo.src) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const frameMarginX = 90;
            const frameMarginY = 55;
            const destW = stripCanvas.width - frameMarginX * 2;
            const destH = slotHeight - frameMarginY * 2;
            const destX = frameMarginX;
            const destY = frameY + frameMarginY;

            // Maintain object-fit: cover behavior
            const srcW = img.naturalWidth;
            const srcH = img.naturalHeight;
            const srcRatio = srcW / srcH;
            const destRatio = destW / destH;

            let sx, sy, sWidth, sHeight;
            if (srcRatio > destRatio) {
              sHeight = srcH;
              sWidth = sHeight * destRatio;
              sx = (srcW - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = srcW;
              sHeight = sWidth / destRatio;
              sx = 0;
              sy = (srcH - sHeight) / 2;
            }

            // --- MIRRORING START ---
            ctx.save();
            ctx.translate(destX + destW / 2, destY + destH / 2);
            ctx.scale(-1, 1); // horizontal flip
            ctx.drawImage(img, sx, sy, sWidth, sHeight, -destW / 2, -destH / 2, destW, destH);
            ctx.restore();
            // --- MIRRORING END ---

            // Draw frame on top
            ctx.drawImage(frameImage, 0, frameY, stripCanvas.width, slotHeight);
            checkAllLoaded();
          };
          img.src = photo.src;
        } else {
          ctx.drawImage(frameImage, 0, frameY, stripCanvas.width, slotHeight);
          checkAllLoaded();
        }
      }
    };
  });
}



// Keep the original for download (optional)
function createPhotoStrip() {
  const stripCanvas = document.createElement('canvas');
  const ctx = stripCanvas.getContext('2d');
  
  stripCanvas.width = 800;
  stripCanvas.height = 1200;
  
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, stripCanvas.width, stripCanvas.height);

  for(let i = 0; i < 3; i++) {
    const photo = photoSlots[i];
    if (photo.src) {
      const y = i * (stripCanvas.height / 3);
      ctx.drawImage(photo, 0, y, stripCanvas.width, stripCanvas.height / 3);
    }
  }

  ctx.fillStyle = '#ff6b00';
  ctx.font = 'bold 30px Creepster';
  ctx.textAlign = 'center';
  ctx.fillText("Muso's Spooky Make-a-Snap", stripCanvas.width / 2, stripCanvas.height - 20);

  return stripCanvas.toDataURL('image/jpeg', 0.9);
}

    function recapturePhotos() {
      if (captureCount === 0) return;
      captureCount--;
      photoSlots[captureCount].src = '';
      recaptureButton.disabled = captureCount === 0;
      captureButton.disabled = false;

      // Remove action buttons if they exist
      const buttonContainer = document.querySelector('.frame-container > div');
      if (buttonContainer && buttonContainer.style.position === 'absolute') {
        buttonContainer.remove();
      }
    }

    startButton.addEventListener('click', startCamera);
    captureButton.addEventListener('click', capturePhoto);
    recaptureButton.addEventListener('click', recapturePhotos);
  </script>
</body>
</html>
